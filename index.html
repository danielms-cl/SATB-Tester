<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1f">
<title>SATB Voice Leading Lab</title>
<style>
  :root {
    --bg: #1a1a1f;
    --panel: #26262e;
    --panel-2: #2f2f3a;
    --paper: #f8f6f0;
    --accent: #7c5cff;
    --accent-2: #5cffb1;
    --text: #e8e8f0;
    --muted: #8a8a99;
    --danger: #ff5c7c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 0;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid #33333f;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    white-space: nowrap;
  }
  h1 span { color: var(--accent); }
  .spacer { flex: 1; }

  .toolbar {
    display: flex;
    gap: 4px;
    background: var(--panel);
    padding: 3px;
    border-radius: 10px;
    border: 1px solid #33333f;
  }
  .toolbar-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: all 0.15s;
    font-family: inherit;
    min-height: 36px;
    min-width: 36px;
  }
  .toolbar-btn:active {
    transform: scale(0.94);
    background: rgba(255,255,255,0.08);
  }
  .toolbar-btn.active[data-voice="S"] { background: #ff7c9c; color: white; }
  .toolbar-btn.active[data-voice="A"] { background: #ffb85c; color: white; }
  .toolbar-btn.active[data-voice="T"] { background: #5cc9ff; color: white; }
  .toolbar-btn.active[data-voice="B"] { background: #7cff9c; color: #1a1a1f; }
  .toolbar-btn.acc-active { background: var(--accent); color: white; }

  .menu-btn {
    background: var(--panel);
    border: 1px solid #3a3a48;
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .menu-btn:active { transform: scale(0.94); }

  /* Análisis */
  .analysis {
    background: var(--panel);
    border-bottom: 1px solid #33333f;
    font-size: 12px;
    padding: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
    max-height: 300px;
  }
  .analysis.collapsed { max-height: 44px; }
  .analysis-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
  }
  .analysis-header .count {
    font-weight: 700;
    font-size: 13px;
  }
  .analysis.good .analysis-header .count { color: var(--accent-2); }
  .analysis.bad .analysis-header .count { color: var(--danger); }
  .analysis-header .chevron {
    color: var(--muted);
    transition: transform 0.2s;
  }
  .analysis.collapsed .analysis-header .chevron {
    transform: rotate(-90deg);
  }
  .analysis-body {
    padding: 0 14px 12px;
    max-height: 250px;
    overflow-y: auto;
  }
  .analysis ul {
    margin: 4px 0 0;
    padding-left: 18px;
    color: var(--text);
  }
  .analysis li { margin: 3px 0; font-size: 12px; }
  .analysis .help-text {
    color: var(--muted);
    font-size: 11px;
    display: block;
    margin-top: 8px;
  }

  /* Instrucción fija */
  .instruction {
    background: rgba(124, 92, 255, 0.12);
    border-bottom: 1px solid #33333f;
    padding: 8px 14px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--text);
  }
  .instruction strong { color: var(--accent-2); }

  /* Partitura */
  .score-wrapper {
    background: var(--paper);
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 8px 0;
    position: relative;
  }
  .score-wrapper::-webkit-scrollbar { display: none; }
  .score-wrapper { scrollbar-width: none; }
  #score {
    display: inline-block;
    position: relative;
    min-width: 100%;
  }
  #score svg { display: block; }

  .highlight-rect {
    position: absolute;
    background: rgba(124, 92, 255, 0.22);
    border: 2px solid rgba(124, 92, 255, 0.5);
    border-radius: 6px;
    pointer-events: none;
    transition: all 0.2s ease;
    opacity: 0;
    z-index: 3;
  }
  .highlight-rect.visible { opacity: 1; }

  .column-indicator {
    position: absolute;
    background: rgba(92, 255, 177, 0.12);
    border: 1px dashed rgba(92, 255, 177, 0.5);
    border-radius: 6px;
    pointer-events: none;
    z-index: 2;
  }

  .note-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    touch-action: pan-x;
  }

  /* Tira de acordes */
  .chord-strip {
    background: var(--bg);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #33333f;
  }
  .nav-btn {
    background: var(--panel);
    border: 1px solid #3a3a48;
    color: var(--text);
    width: 44px;
    height: 44px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    flex-shrink: 0;
  }
  .nav-btn:active { transform: scale(0.92); background: var(--panel-2); }
  .nav-btn:disabled { opacity: 0.3; }

  .chord-counter {
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    flex: 1;
    letter-spacing: 0.3px;
  }
  .chord-counter .num {
    color: var(--accent-2);
    font-size: 18px;
    margin: 0 2px;
  }
  .chord-counter .total {
    color: var(--muted);
    font-size: 13px;
  }

  .action-btn {
    background: var(--panel);
    border: 1px solid #3a3a48;
    color: var(--text);
    width: 44px;
    height: 44px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    flex-shrink: 0;
  }
  .action-btn:active { transform: scale(0.92); }
  .action-btn.play { color: var(--accent-2); border-color: rgba(92,255,177,0.35); }
  .action-btn.play:active { background: rgba(92,255,177,0.15); }
  .action-btn.play.playing { background: var(--danger); color: white; border-color: var(--danger); }
  .action-btn.add { color: var(--accent-2); }
  .action-btn.del { color: var(--danger); border-color: rgba(255,92,124,0.35); }
  .action-btn.del:disabled { opacity: 0.3; }

  /* Duración */
  .duration-bar {
    background: var(--bg);
    padding: 8px 12px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #33333f;
  }
  .duration-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .duration-group {
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .duration-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid #3a3a48;
    color: var(--muted);
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.1s;
    padding: 0;
  }
  .duration-btn:active { transform: scale(0.95); }
  .duration-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* Play sticky */
  .play-bar {
    position: sticky;
    bottom: 0;
    z-index: 40;
    background: linear-gradient(transparent, var(--bg) 30%);
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .play-main {
    width: 100%;
    height: 56px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
    font-family: inherit;
    letter-spacing: 0.3px;
  }
  .play-main:active { transform: scale(0.98); }
  .play-main.playing { background: var(--danger); }

  /* Menú */
  .menu-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 260px;
    max-width: 80vw;
    height: 100%;
    background: var(--panel);
    z-index: 200;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    border-left: 1px solid #33333f;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .menu-panel.open { transform: translateX(0); }
  .menu-panel h3 {
    margin: 0 0 8px;
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .menu-item {
    background: var(--panel-2);
    border: 1px solid #3a3a48;
    color: var(--text);
    padding: 14px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .menu-item:active { transform: scale(0.98); }
  .menu-item.danger { color: var(--danger); border-color: rgba(255,92,124,0.35); }
  .menu-item .icon { font-size: 18px; }

  .menu-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .menu-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .tempo-input {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #3a3a48;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 16px;
    font-weight: 700;
    width: 80px;
    text-align: center;
    font-family: inherit;
    outline: none;
  }
  .tempo-input:focus { border-color: var(--accent); }

  .import-input { display: none; }

  @media (min-width: 768px) {
    body { max-width: 900px; margin: 0 auto; }
    header { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>SATB <span>Lab</span></h1>
    <div class="spacer"></div>
    <div class="toolbar" id="voiceToolbar">
      <button class="toolbar-btn active" data-voice="S" aria-label="Soprano">S</button>
      <button class="toolbar-btn" data-voice="A" aria-label="Alto">A</button>
      <button class="toolbar-btn" data-voice="T" aria-label="Tenor">T</button>
      <button class="toolbar-btn" data-voice="B" aria-label="Bajo">B</button>
    </div>
    <div class="toolbar" id="accToolbar">
      <button class="toolbar-btn acc-active" data-acc="0" aria-label="Natural">♮</button>
      <button class="toolbar-btn" data-acc="1" aria-label="Sostenido">♯</button>
      <button class="toolbar-btn" data-acc="-1" aria-label="Bemol">♭</button>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Menú">⋮</button>
  </div>
</header>

<div class="analysis good collapsed" id="analysis">
  <div class="analysis-header" id="analysisHeader">
    <span class="count">✓ Sin problemas</span>
    <span class="chevron">▾</span>
  </div>
  <div class="analysis-body" id="analysisBody"></div>
</div>

<div class="instruction">
  <strong>Voz:</strong> S/A/T/B arriba · <strong>Alteración:</strong> ♮ ♯ ♭ · 
  <strong>Toca el pentagrama</strong> para escribir la nota · 
  <strong>Mantén pulsado</strong> para borrarla.
</div>

<div class="score-wrapper" id="scoreWrapper">
  <div id="score"></div>
</div>

<div class="chord-strip">
  <button class="nav-btn" id="prevBtn" aria-label="Acorde anterior">◀</button>
  <div class="chord-counter">
    Ac. <span class="num" id="chordNum">1</span><span class="total">/<span id="chordTotal">4</span></span>
  </div>
  <button class="nav-btn" id="nextBtn" aria-label="Acorde siguiente">▶</button>
  <button class="action-btn play" id="playChordBtn" aria-label="Reproducir acorde actual">▶</button>
  <button class="action-btn del" id="delChordBtn" aria-label="Eliminar acorde">🗑</button>
  <button class="action-btn add" id="addChordBtn" aria-label="Añadir acorde">+</button>
</div>

<div class="duration-bar">
  <span class="duration-label">Dur.</span>
  <div class="duration-group" id="durationGroup">
    <button class="duration-btn" data-duration="negra">♩ Negra</button>
    <button class="duration-btn" data-duration="blanca">𝅗𝅥 Blanca</button>
    <button class="duration-btn" data-duration="redonda">𝅝 Redonda</button>
  </div>
</div>

<div class="play-bar">
  <button class="play-main" id="playBtn">
    <span id="playBtnIcon">▶</span>
    <span id="playBtnLabel">Reproducir progresión</span>
  </button>
</div>

<div class="menu-backdrop" id="menuBackdrop"></div>
<div class="menu-panel" id="menuPanel">
  <h3>Ejercicio</h3>
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
    <span style="font-size:13px;color:var(--muted);font-weight:700;">BPM</span>
    <input class="tempo-input" type="number" id="tempo" value="60" min="20" max="240" inputmode="numeric">
  </div>
  <button class="menu-item" id="saveBtn"><span class="icon">⇩</span> Guardar JSON</button>
  <button class="menu-item" id="loadBtn"><span class="icon">⇧</span> Cargar JSON</button>
  <button class="menu-item danger" id="resetBtn"><span class="icon">↺</span> Restablecer</button>
  <input class="import-input" type="file" id="loadInput" accept=".json,application/json">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<script>
/* ============================================================
   MODELO MUSICAL
   ============================================================ */

const NOTES = [
  { name: 'C', semitone: 0 },
  { name: 'D', semitone: 2 },
  { name: 'E', semitone: 4 },
  { name: 'F', semitone: 5 },
  { name: 'G', semitone: 7 },
  { name: 'A', semitone: 9 },
  { name: 'B', semitone: 11 },
];

const VOICE_RANGES = {
  S: { min: 60, max: 81, default: 72 },
  A: { min: 53, max: 76, default: 67 },
  T: { min: 48, max: 71, default: 60 },
  B: { min: 40, max: 62, default: 48 },
};

const VOICES = ['S', 'A', 'T', 'B'];

const DURATIONS = {
  'negra':   { beats: 1, label: '♩',  shortLabel: 'Negra',   toneValue: '4n', vexKey: 'q' },
  'blanca':  { beats: 2, label: '𝅗𝅥', shortLabel: 'Blanca',  toneValue: '2n', vexKey: 'h' },
  'redonda': { beats: 4, label: '𝅝',  shortLabel: 'Redonda', toneValue: '1n', vexKey: 'w' },
};

const DIATONIC_LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const TOP_LINE_REFERENCE = {
  treble: { letter: 3, octave: 5 }, // F5
  bass:   { letter: 5, octave: 3 }, // A3
};

/* ============================================================
   ESTADO
   ============================================================ */

let chords = [];
let playing = false;
let _activeVoice = 'S';
let _activeChordIndex = 0;
let _accMode = 0;

/* ============================================================
   UTILIDADES
   ============================================================ */

function midiToNoteName(midi) {
  const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const octave = Math.floor(midi / 12) - 1;
  return names[midi % 12] + octave;
}

function getNoteMidi(noteName, accidentalValue, octave) {
  const n = NOTES.find(x => x.name === noteName);
  if (!n) return null;
  return (octave + 1) * 12 + n.semitone + accidentalValue;
}

function isInRange(voice, midi) {
  const r = VOICE_RANGES[voice];
  return midi >= r.min && midi <= r.max;
}

function diatonicToNote(letterIndex, octave, stepsDown) {
  const totalIndex = octave * 7 + letterIndex - stepsDown;
  const newOctave = Math.floor(totalIndex / 7);
  const newLetter = ((totalIndex % 7) + 7) % 7;
  return { note: DIATONIC_LETTERS[newLetter], octave: newOctave };
}

function getBpm() {
  const el = document.getElementById('tempo');
  return Math.min(240, Math.max(20, parseInt(el.value) || 60));
}

function vibrate(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

/* ============================================================
   TOOLBAR
   ============================================================ */

function setActiveVoice(v) {
  _activeVoice = v;
  document.querySelectorAll('#voiceToolbar .toolbar-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.voice === v);
  });
  // Ajustar overlay según pentagrama de la voz activa
  const geom = window._staveGeometry;
  if (geom) {
    buildOverlay(geom);
  }
}

document.querySelectorAll('#voiceToolbar .toolbar-btn').forEach(btn => {
  btn.addEventListener('click', () => setActiveVoice(btn.dataset.voice));
});

document.querySelectorAll('#accToolbar .toolbar-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    _accMode = parseInt(btn.dataset.acc);
    document.querySelectorAll('#accToolbar .toolbar-btn').forEach(b => b.classList.remove('acc-active'));
    btn.classList.add('acc-active');
  });
});

/* ============================================================
   ANÁLISIS (colapsable)
   ============================================================ */

document.getElementById('analysisHeader').addEventListener('click', () => {
  document.getElementById('analysis').classList.toggle('collapsed');
});

/* ============================================================
   RENDER DE PARTITURA
   ============================================================ */

function voiceToVexKey(voiceData) {
  const { note, octave } = voiceData;
  return note.toLowerCase() + '/' + octave;
}

function renderStave(container, data) {
  container.innerHTML = '';

  if (typeof Vex === 'undefined') {
    container.innerHTML = '<div style="padding:40px;color:#888;text-align:center;">VexFlow no disponible</div>';
    return null;
  }

  const VF = Vex.Flow || Vex;
  const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = VF;
  if (!Renderer || !Stave || !StaveNote) return null;

  if (data.length === 0) {
    container.innerHTML = '<div style="padding:40px;color:#888;text-align:center;">Sin acordes</div>';
    return null;
  }

  const padding = 40;
  const chordWidth = 88;
  const topStaveY = 25;
  const bottomStaveY = 130;
  const width = Math.max(container.clientWidth || 320, padding * 2 + data.length * chordWidth);
  const height = 240;

  const renderer = new Renderer(container, Renderer.Backends.SVG);
  renderer.resize(width, height);
  const ctx = renderer.getContext();
  ctx.setFont('Arial', 10);

  const staveWidth = width - padding * 2;

  const topStave = new Stave(padding, topStaveY, staveWidth);
  topStave.addClef('treble');
  topStave.setContext(ctx).draw();

  const bottomStave = new Stave(padding, bottomStaveY, staveWidth);
  bottomStave.addClef('bass');
  bottomStave.setContext(ctx).draw();

  const noteArrays = { S: [], A: [], T: [], B: [] };
  const voiceBeats = {}; // controla el total de beats por voz
  VOICES.forEach(v => voiceBeats[v] = 0);

  // Genera notas o silencios según el modelo
  data.forEach((chord, i) => {
    const durKey = DURATIONS[chord.duration].vexKey;
    const beats = DURATIONS[chord.duration].beats;

    VOICES.forEach(v => {
      const vd = chord.voices[v];
      const clef = (v === 'S' || v === 'A') ? 'treble' : 'bass';
      const stem = (v === 'S' || v === 'T') ? 1 : -1;

      let note;
      if (vd && vd.rest) {
        // Silencio: usamos la duración con "r"
        const restDur = durKey + 'r';
        note = new StaveNote({
          keys: [clef === 'treble' ? 'b/4' : 'd/3'],
          duration: restDur,
          clef,
          align_center: false
        });
        note.setStyle({ fillStyle: 'transparent', strokeStyle: 'transparent' });
        // Añadimos un silencio por encima
        const rest = new StaveNote({
          keys: [clef === 'treble' ? 'b/4' : 'd/3'],
          duration: restDur,
          clef
        });
        noteArrays[v].push(rest);
      } else if (vd) {
        note = new StaveNote({
          keys: [voiceToVexKey(vd)],
          duration: durKey,
          clef,
          stem_direction: stem
        });
        if (vd.acc === 1) note.addModifier(new Accidental('#'), 0);
        if (vd.acc === -1) note.addModifier(new Accidental('b'), 0);
        noteArrays[v].push(note);
      } else {
        // Sin datos: silencio
        const rest = new StaveNote({
          keys: [clef === 'treble' ? 'b/4' : 'd/3'],
          duration: durKey + 'r',
          clef
        });
        noteArrays[v].push(rest);
      }
      voiceBeats[v] += beats;
    });
  });

  const totalBeats = Math.max(...VOICES.map(v => voiceBeats[v]), 1);

  const voices = VOICES.map(v =>
    new Voice({ num_beats: totalBeats, beat_value: 4 }).setMode(Voice.Mode.SOFT)
  );
  voices[0].addTickables(noteArrays.S);
  voices[1].addTickables(noteArrays.A);
  voices[2].addTickables(noteArrays.T);
  voices[3].addTickables(noteArrays.B);

  try {
    new Formatter().joinVoices([voices[0], voices[1]]).format([voices[0], voices[1]], staveWidth - 20);
    new Formatter().joinVoices([voices[2], voices[3]]).format([voices[2], voices[3]], staveWidth - 20);
  } catch (e) {
    console.warn('Error de formato:', e);
  }

  voices[0].draw(ctx, topStave);
  voices[1].draw(ctx, topStave);
  voices[2].draw(ctx, bottomStave);
  voices[3].draw(ctx, bottomStave);

  const positions = noteArrays.S.map(n => {
    try { return n.getAbsoluteX(); } catch (e) { return 0; }
  });

  const lineSpacing = topStave.getSpacingBetweenLines();

  return {
    width, height, padding, staveWidth, chordWidth,
    lineSpacing,
    numChords: data.length,
    positions,
    topStaveY, bottomStaveY,
    topStaveTopLineY: topStave.getYForLine(0),
    bottomStaveTopLineY: bottomStave.getYForLine(0),
  };
}

/* ============================================================
   ESCRITURA / BORRADO
   ============================================================ */

function writeNoteAt(chordIndex, voice, step, isTop) {
  const clef = isTop ? 'treble' : 'bass';
  const ref = TOP_LINE_REFERENCE[clef];
  const noteInfo = diatonicToNote(ref.letter, ref.octave, step);
  const midi = getNoteMidi(noteInfo.note, 0, noteInfo.octave);
  const range = VOICE_RANGES[voice];
  if (midi < range.min || midi > range.max) {
    vibrate([20, 30, 20]);
    return false;
  }
  chords[chordIndex].voices[voice] = {
    note: noteInfo.note,
    octave: noteInfo.octave,
    acc: _accMode
  };
  const finalMidi = getNoteMidi(noteInfo.note, _accMode, noteInfo.octave);
  playNotePreview(midiToNoteName(finalMidi));
  return true;
}

function deleteNoteAt(chordIndex, voice) {
  if (!chords[chordIndex]) return;
  chords[chordIndex].voices[voice] = { rest: true };
  vibrate(30);
}

/* ============================================================
   OVERLAY TÁCTIL
   ============================================================ */

let _longPressTimer = null;
let _longPressFired = false;
let _touchStartPos = null;

function buildOverlay(geom) {
  const container = document.getElementById('score');
  const old = container.querySelector('.note-overlay');
  if (old) old.remove();
  if (!geom) return;

  const overlay = document.createElement('div');
  overlay.className = 'note-overlay';

  // Click para desktop
  overlay.addEventListener('click', (e) => {
    if (_longPressFired) { _longPressFired = false; return; }
    const rect = overlay.getBoundingClientRect();
    handleTap(e.clientX - rect.left, e.clientY - rect.top);
  });

  // Touch: long-press para borrar
  overlay.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    _longPressFired = false;
    const t = e.touches[0];
    const rect = overlay.getBoundingClientRect();
    _touchStartPos = { x: t.clientX - rect.left, y: t.clientY - rect.top };
    if (_longPressTimer) clearTimeout(_longPressTimer);
    _longPressTimer = setTimeout(() => {
      _longPressFired = true;
      handleLongPress(_touchStartPos.x, _touchStartPos.y);
    }, 500);
  }, { passive: true });

  overlay.addEventListener('touchend', (e) => {
    if (_longPressTimer) { clearTimeout(_longPressTimer); _longPressTimer = null; }
    if (_longPressFired) return;
    if (!_touchStartPos) return;
    // Tap corto: escribir
    handleTap(_touchStartPos.x, _touchStartPos.y);
    _touchStartPos = null;
  });

  overlay.addEventListener('touchmove', () => {
    if (_longPressTimer) { clearTimeout(_longPressTimer); _longPressTimer = null; }
    _touchStartPos = null;
  }, { passive: true });

  overlay.addEventListener('contextmenu', e => e.preventDefault());

  container.appendChild(overlay);
}

function hitTest(x, y, geom) {
  const isTop = (_activeVoice === 'S' || _activeVoice === 'A');
  const topY = isTop ? geom.topStaveTopLineY : geom.bottomStaveTopLineY;
  const stepSize = geom.lineSpacing / 2;
  const step = Math.round((y - topY) / stepSize);
  if (step < -8 || step > 14) return null;
  let best = -1, bestD = Infinity;
  geom.positions.forEach((p, i) => {
    const d = Math.abs(x - p);
    if (d < bestD) { bestD = d; best = i; }
  });
  if (best < 0 || bestD > geom.chordWidth / 2) return null;
  return { chordIndex: best, step, isTop };
}

function handleTap(x, y) {
  const geom = window._staveGeometry;
  if (!geom) return;
  const hit = hitTest(x, y, geom);
  if (!hit) return;
  _activeChordIndex = hit.chordIndex;
  const ok = writeNoteAt(hit.chordIndex, _activeVoice, hit.step, hit.isTop);
  if (ok) {
    vibrate(15);
    redrawAll();
  }
}

function handleLongPress(x, y) {
  const geom = window._staveGeometry;
  if (!geom) return;
  const hit = hitTest(x, y, geom);
  if (!hit) return;
  _activeChordIndex = hit.chordIndex;
  deleteNoteAt(hit.chordIndex, _activeVoice);
  redrawAll();
}

/* ============================================================
   HIGHLIGHT Y COLUMN INDICATOR
   ============================================================ */

function buildHighlight() {
  const container = document.getElementById('score');
  let hl = document.getElementById('highlightRect');
  if (hl) hl.remove();
  hl = document.createElement('div');
  hl.className = 'highlight-rect';
  hl.id = 'highlightRect';
  container.appendChild(hl);
}

function buildColumnIndicator() {
  const container = document.getElementById('score');
  let ind = document.getElementById('columnIndicator');
  if (ind) ind.remove();
  ind = document.createElement('div');
  ind.className = 'column-indicator';
  ind.id = 'columnIndicator';
  container.appendChild(ind);
}

function updateColumnIndicator() {
  const ind = document.getElementById('columnIndicator');
  const geom = window._staveGeometry;
  if (!ind || !geom) return;
  if (_activeChordIndex < geom.positions.length) {
    ind.style.left = (geom.positions[_activeChordIndex] - 22) + 'px';
    ind.style.top = '10px';
    ind.style.width = '60px';
    ind.style.height = '220px';
    ind.style.display = 'block';
  }
}

function showPlayingHighlight(i) {
  const rect = document.getElementById('highlightRect');
  const geom = window._staveGeometry;
  if (!rect || !geom || geom.positions[i] === undefined) return;
  rect.style.left = (geom.positions[i] - 22) + 'px';
  rect.style.top = '10px';
  rect.style.width = '60px';
  rect.style.height = '220px';
  rect.classList.add('visible');
}

function hidePlayingHighlight() {
  const rect = document.getElementById('highlightRect');
  if (rect) rect.classList.remove('visible');
}

/* ============================================================
   NAVEGACIÓN Y CONTROLES
   ============================================================ */

document.getElementById('prevBtn').addEventListener('click', () => {
  _activeChordIndex = Math.max(0, _activeChordIndex - 1);
  updateChordUI();
  scrollToActiveChord();
});

document.getElementById('nextBtn').addEventListener('click', () => {
  _activeChordIndex = Math.min(chords.length - 1, _activeChordIndex + 1);
  updateChordUI();
  scrollToActiveChord();
});

document.getElementById('playChordBtn').addEventListener('click', () => {
  playChord(_activeChordIndex);
});

document.getElementById('addChordBtn').addEventListener('click', () => {
  const last = chords[chords.length - 1];
  chords.push(JSON.parse(JSON.stringify(last)));
  _activeChordIndex = chords.length - 1;
  redrawAll();
});

document.getElementById('delChordBtn').addEventListener('click', () => {
  if (chords.length <= 1) return;
  if (!confirm('¿Eliminar este acorde?')) return;
  chords.splice(_activeChordIndex, 1);
  if (_activeChordIndex >= chords.length) _activeChordIndex = chords.length - 1;
  redrawAll();
});

document.querySelectorAll('#durationGroup .duration-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!chords[_activeChordIndex]) return;
    chords[_activeChordIndex].duration = btn.dataset.duration;
    redrawAll();
  });
});

function updateChordUI() {
  document.getElementById('chordNum').textContent = _activeChordIndex + 1;
  document.getElementById('chordTotal').textContent = chords.length;
  document.getElementById('prevBtn').disabled = _activeChordIndex === 0;
  document.getElementById('nextBtn').disabled = _activeChordIndex >= chords.length - 1;
  document.getElementById('delChordBtn').disabled = chords.length <= 1;

  const dur = chords[_activeChordIndex]?.duration || 'negra';
  document.querySelectorAll('#durationGroup .duration-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.duration === dur);
  });

  updateColumnIndicator();
}

function scrollToActiveChord() {
  const geom = window._staveGeometry;
  const wrapper = document.getElementById('scoreWrapper');
  if (!geom || !wrapper) return;
  const x = geom.positions[_activeChordIndex];
  if (x === undefined) return;
  const target = x - wrapper.clientWidth / 2 + geom.chordWidth / 2;
  wrapper.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
}

/* ============================================================
   REDRAW PRINCIPAL
   ============================================================ */

function redrawAll() {
  const container = document.getElementById('score');
  container.innerHTML = '';

  const geom = renderStave(container, chords);
  if (geom) {
    window._staveGeometry = geom;
    buildHighlight();
    buildColumnIndicator();
    buildOverlay(geom);
    updateColumnIndicator();
    scrollToActiveChord();
  }

  analyze(chords);
  updateChordUI();

  try { localStorage.setItem('satb-tester', JSON.stringify(chords)); } catch (e) {}
}

/* ============================================================
   AUDIO
   ============================================================ */

let synth = null;

function initSynth() {
  if (synth) return;
  synth = new Tone.PolySynth(Tone.FMSynth, {
    harmonicity: 1.5,
    modulationIndex: 4,
    oscillator: { type: 'sine' },
    envelope: { attack: 0.05, decay: 0.2, sustain: 0.8, release: 0.6 },
    modulation: { type: 'sine' },
    modulationEnvelope: { attack: 0.1, decay: 0.3, sustain: 0.4, release: 0.5 }
  });
  synth.volume.value = -10;
  const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.25 }).toDestination();
  synth.connect(reverb);
}

async function playNotePreview(noteName) {
  try {
    await Tone.start();
    initSynth();
    synth.triggerAttackRelease(noteName, 0.3, Tone.now());
  } catch (e) {}
}

function getChordNotes(chord) {
  return VOICES.map(v => {
    const vd = chord.voices[v];
    if (!vd || vd.rest) return null;
    const midi = getNoteMidi(vd.note, vd.acc, vd.octave);
    return midiToNoteName(midi);
  }).filter(Boolean);
}

async function playChord(i) {
  await Tone.start();
  initSynth();
  if (playing) stopPlayback();
  const chord = chords[i];
  if (!chord) return;
  const notes = getChordNotes(chord);
  if (notes.length === 0) return;
  const dur = DURATIONS[chord.duration].beats * (60 / getBpm());
  const btn = document.getElementById('playChordBtn');
  btn.classList.add('playing');
  btn.textContent = '■';
  showPlayingHighlight(i);
  synth.triggerAttackRelease(notes, dur * 0.95, Tone.now());
  setTimeout(() => {
    btn.classList.remove('playing');
    btn.textContent = '▶';
    hidePlayingHighlight();
  }, dur * 1000 + 200);
}

async function playSequence() {
  if (playing) { stopPlayback(); return; }
  await Tone.start();
  initSynth();

  playing = true;
  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('playBtnIcon').textContent = '■';
  document.getElementById('playBtnLabel').textContent = 'Detener';

  const bpm = getBpm();
  Tone.Transport.stop();
  Tone.Transport.cancel(0);
  Tone.Transport.bpm.value = bpm;

  const spb = 60 / bpm;
  let t = 0;
  chords.forEach((chord, i) => {
    const notes = getChordNotes(chord);
    const dur = DURATIONS[chord.duration].beats * spb;
    Tone.Transport.schedule(time => {
      if (notes.length > 0) synth.triggerAttackRelease(notes, dur * 0.95, time);
      Tone.Draw.schedule(() => {
        showPlayingHighlight(i);
        _activeChordIndex = i;
        updateChordUI();
        scrollToActiveChord();
      }, time);
    }, t);
    t += dur;
  });

  Tone.Transport.schedule(time => {
    Tone.Draw.schedule(finishPlayback, time);
  }, t + 0.05);

  Tone.Transport.start('+0.05');
}

function finishPlayback() {
  playing = false;
  Tone.Transport.stop();
  Tone.Transport.cancel(0);
  const btn = document.getElementById('playBtn');
  btn.classList.remove('playing');
  document.getElementById('playBtnIcon').textContent = '▶';
  document.getElementById('playBtnLabel').textContent = 'Reproducir progresión';
  hidePlayingHighlight();
  if (synth) synth.releaseAll();
}

function stopPlayback() { finishPlayback(); }

document.getElementById('playBtn').addEventListener('click', playSequence);

/* ============================================================
   ANÁLISIS
   ============================================================ */

function analyze(data) {
  const issues = [];
  const add = (i, type, msg) => issues.push({ i, type, msg });
  const midi = data.map(c =>
    VOICES.map(v => {
      const vd = c.voices[v];
      if (!vd || vd.rest) return null;
      return getNoteMidi(vd.note, vd.acc, vd.octave);
    })
  );

  const intervalClass = (a, b) => ((a - b) % 12 + 12) % 12;
  const direction = (from, to) => Math.sign(to - from);

  midi.forEach((m, i) => {
    if (m.some(x => x === null)) return;

    for (let k = 0; k < 3; k++) {
      if (m[k] < m[k + 1]) add(i, 'vertical', `cruce ${VOICES[k]}–${VOICES[k + 1]}`);
    }
    if (m[0] - m[1] > 12) add(i, 'spacing', 'separación S–A > octava');
    if (m[1] - m[2] > 12) add(i, 'spacing', 'separación A–T > octava');
    VOICES.forEach((v, k) => {
      if (!isInRange(v, m[k])) add(i, 'range', `${v} fuera de registro`);
    });

    if (i > 0) {
      const p = midi[i - 1];
      if (p.some(x => x === null)) return;

      for (let a = 0; a < 4; a++) {
        for (let b = a + 1; b < 4; b++) {
          const prevIC = intervalClass(p[a], p[b]);
          const currIC = intervalClass(m[a], m[b]);
          const da = direction(p[a], m[a]);
          const db = direction(p[b], m[b]);
          if (da !== 0 && da === db && prevIC === currIC && (currIC === 7 || currIC === 0)) {
            add(i, 'parallel', `${currIC === 7 ? '5as' : '8vas'} paralelas ${VOICES[a]}–${VOICES[b]}`);
          }
          if (a === 0 && b === 3 && da !== 0 && da === db && (currIC === 7 || currIC === 0)) {
            if (Math.abs(m[0] - p[0]) > 2) {
              add(i, 'direct', `${currIC === 7 ? '5a' : '8va'} directa S–B`);
            }
          }
        }
      }
      for (let k = 0; k < 3; k++) {
        if (m[k] < p[k + 1]) add(i, 'overlap', `superposición ${VOICES[k]}–${VOICES[k + 1]}`);
        if (m[k + 1] > p[k]) add(i, 'overlap', `superposición ${VOICES[k + 1]}–${VOICES[k]}`);
      }
      VOICES.forEach((v, k) => {
        if (Math.abs(m[k] - p[k]) > 12) add(i, 'leap', `${v} salto > octava`);
      });
    }
  });

  const unique = [];
  const seen = new Set();
  issues.forEach(x => {
    const key = `${x.i}|${x.msg}`;
    if (!seen.has(key)) { seen.add(key); unique.push(x); }
  });

  const el = document.getElementById('analysis');
  const body = document.getElementById('analysisBody');
  const count = el.querySelector('.count');

  if (!unique.length) {
    el.className = 'analysis good collapsed';
    count.textContent = '✓ Sin problemas detectados';
    body.innerHTML = '<span class="help-text">Comprueba reglas básicas de escritura a 4 voces.</span>';
    return;
  }

  const labels = {
    vertical: 'disposición', spacing: 'espaciado', range: 'registro',
    parallel: 'paralelas', direct: 'directo', overlap: 'superposición', leap: 'saltos'
  };
  const counts = {};
  unique.forEach(x => counts[x.type] = (counts[x.type] || 0) + 1);
  const summary = Object.entries(counts).map(([k, v]) => `${labels[k]}: ${v}`).join(' · ');

  el.className = 'analysis bad collapsed';
  count.textContent = `⚠ ${unique.length} aviso${unique.length === 1 ? '' : 's'}`;
  body.innerHTML = `
    <span class="help-text">${summary}</span>
    <ul>${unique.map(x => `<li><strong>Ac. ${x.i + 1}:</strong> ${x.msg}</li>`).join('')}</ul>
  `;
}

/* ============================================================
   GUARDAR / CARGAR / RESET
   ============================================================ */

function getCurrentExercise() {
  return { version: 3, app: 'SATB Lab', tempo: getBpm(), chords };
}

function downloadExercise() {
  const blob = new Blob([JSON.stringify(getCurrentExercise(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'satb-ejercicio.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  closeMenu();
}

function validateExercise(data) {
  return data && Array.isArray(data.chords) && data.chords.length > 0 &&
    data.chords.every(c =>
      DURATIONS[c.duration] && c.voices &&
      VOICES.every(v => c.voices[v] && (c.voices[v].rest ||
        (NOTES.some(n => n.name === c.voices[v].note) &&
         Number.isInteger(c.voices[v].octave) &&
         [-1,0,1].includes(Number(c.voices[v].acc)))))
    );
}

function resetExercise() {
  if (!confirm('¿Restablecer el ejercicio inicial?')) return;
  try { localStorage.removeItem('satb-tester'); } catch (e) {}
  chords = getDefaultChords();
  _activeChordIndex = 0;
  document.getElementById('tempo').value = 60;
  redrawAll();
  closeMenu();
}

function closeMenu() {
  document.getElementById('menuPanel').classList.remove('open');
  document.getElementById('menuBackdrop').classList.remove('open');
}

document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('menuPanel').classList.add('open');
  document.getElementById('menuBackdrop').classList.add('open');
});
document.getElementById('menuBackdrop').addEventListener('click', closeMenu);
document.getElementById('saveBtn').addEventListener('click', downloadExercise);
document.getElementById('resetBtn').addEventListener('click', resetExercise);
document.getElementById('loadBtn').addEventListener('click', () => {
  document.getElementById('loadInput').click();
});
document.getElementById('loadInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!validateExercise(data)) throw new Error('inválido');
    chords = data.chords;
    if (data.tempo) document.getElementById('tempo').value = data.tempo;
    _activeChordIndex = 0;
    redrawAll();
    closeMenu();
  } catch (err) {
    alert('No se pudo cargar el archivo.');
  } finally {
    e.target.value = '';
  }
});

document.getElementById('tempo').addEventListener('change', () => {
  document.getElementById('tempo').value = getBpm();
});

/* ============================================================
   INIT
   ============================================================ */

function getDefaultChords() {
  return [
    { voices: { S: { note: 'E', octave: 5, acc: 0 }, A: { note: 'C', octave: 5, acc: 0 }, T: { note: 'G', octave: 4, acc: 0 }, B: { note: 'C', octave: 3, acc: 0 } }, duration: 'negra' },
    { voices: { S: { note: 'F', octave: 5, acc: 0 }, A: { note: 'C', octave: 5, acc: 0 }, T: { note: 'A', octave: 4, acc: 0 }, B: { note: 'F', octave: 3, acc: 0 } }, duration: 'negra' },
    { voices: { S: { note: 'D', octave: 5, acc: 0 }, A: { note: 'B', octave: 4, acc: 0 }, T: { note: 'G', octave: 4, acc: 0 }, B: { note: 'G', octave: 3, acc: 0 } }, duration: 'negra' },
    { voices: { S: { note: 'C', octave: 5, acc: 0 }, A: { note: 'G', octave: 4, acc: 0 }, T: { note: 'E', octave: 4, acc: 0 }, B: { note: 'C', octave: 3, acc: 0 } }, duration: 'negra' }
  ];
}

function init() {
  try {
    const saved = JSON.parse(localStorage.getItem('satb-tester') || 'null');
    if (saved && Array.isArray(saved) && saved.length && saved.every(c =>
      DURATIONS[c.duration] && c.voices && VOICES.every(v => c.voices[v] && (c.voices[v].rest ||
        getNoteMidi(c.voices[v].note, 0, 4) !== null)))) {
      chords = saved;
    } else {
      chords = getDefaultChords();
    }
  } catch (e) {
    chords = getDefaultChords();
  }

  document.querySelectorAll('#voiceToolbar .toolbar-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.voice === 'S');
  });
  redrawAll();
}

window.addEventListener('load', () => {
  setTimeout(init, 100);
});

let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => redrawAll(), 200);
});

// Prevenir zoom por doble-tap
let _lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - _lastTouchEnd <= 300) e.preventDefault();
  _lastTouchEnd = now;
}, { passive: false });

</script>
